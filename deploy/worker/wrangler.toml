# Cloudflare Worker for serving zasqua.org from Backblaze B2.
#
# account_id is read from the CLOUDFLARE_ACCOUNT_ID env var — not stored here
# because this repo is public. Set it in your shell profile or pass it inline:
#
#   CLOUDFLARE_ACCOUNT_ID=... npx wrangler deploy
#
# To deploy staging: cd worker && npx wrangler deploy --env staging
# To deploy prod:    cd worker && npx wrangler deploy
# To tail:           cd worker && npx wrangler tail
#
# Bucket topology:
#   * Prod (zasqua.org)            -> zasqua-site bucket
#   * Staging (staging.zasqua.org) -> zasqua-staging bucket
#
# Prod and staging read from distinct buckets, so staging changes never go
# live on prod without an explicit deploy against the prod bucket and a
# Cloudflare cache purge. See the publishing-zasqua skill for the current
# deploy workflow shape and input variables.

name = "zasqua-site"
main = "worker.js"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "SITE"
bucket_name = "zasqua-site"

# B2 storage origin (R2 -> B2 transition, 2026-07). When SITE_ORIGIN is set,
# the Worker fetches the site over HTTP from the public Backblaze B2 bucket
# instead of the R2 SITE binding above. FLIPPED 2026-07-08: production now
# serves from B2. Rollback is a config-only change — comment this line out and
# redeploy; the R2 SITE binding this environment still carries takes back over.
# The transition covers the site only. The value is the B2 native public
# download base URL (no trailing slash), from this account's downloadUrl.
[vars]
SITE_ORIGIN = "https://f001.backblazeb2.com/file/zasqua-site"

# Redirect table: old entity, place and description codes mapped to their
# current addresses, answered by the Worker as 301s when the site has no page
# at the old path. The deploy workflow fills it from the exports
# (deploy/build-redirects.py). It follows [vars] so that SITE_ORIGIN above
# stays inside the vars table.
[[kv_namespaces]]
binding = "REDIRECTS"
id = "8b38f16d45fe443084937e12b65f81df"

# Route staging.zasqua.org/* attached via Cloudflare dashboard (matches
# prod convention — wrangler.toml stays host-agnostic). Dashboard: Workers
# & Pages → zasqua-staging → Triggers → Custom Domains → Add Custom Domain.

# Staging environment — deployed separately via `wrangler deploy --env staging`.
# Serves staging.zasqua.org from the zasqua-staging R2 bucket. STAGING=true
# gates the Worker-injected robots.txt disallow and X-Robots-Tag header
# (see worker.js) so staging content is never indexed.
[env.staging]
name = "zasqua-staging"

[[env.staging.r2_buckets]]
binding = "SITE"
bucket_name = "zasqua-staging"

[env.staging.vars]
STAGING = "true"

# B2 storage origin (R2 -> B2 transition, 2026-07). When SITE_ORIGIN is set,
# the Worker fetches the site over HTTP from the public Backblaze B2 bucket
# instead of the R2 SITE binding above. FLIPPED 2026-07-07: staging now serves
# from B2. Rollback is a config-only change — comment this line out and
# redeploy, and the R2 SITE binding the environment still carries takes back
# over. The transition covers the site only.
#
# The value is the B2 native public download base URL (no trailing slash); the
# f001 download host is this account's downloadUrl from `b2 account get`. The
# bucket is public.
SITE_ORIGIN = "https://f001.backblazeb2.com/file/zasqua-staging"

# Staging's own redirect table, filled by the deploy workflow like the
# production one above. It follows [env.staging.vars] so that SITE_ORIGIN
# above stays inside the vars table.
[[env.staging.kv_namespaces]]
binding = "REDIRECTS"
id = "1900a3f647a648bfb6705006e0d0cc7b"

# Version: v1.3.0
