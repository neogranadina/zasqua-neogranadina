# Build and deploy the Neogranadina instance to R2 or B2
#
# Standalone-era deploy: the instance consumes the published engine
# (@ucsb-ampl/zasqua) from the npm registry, so `npm ci` pulls the engine,
# Hugo Extended, Pagefind, and Tailwind together. The engine is
# storage-agnostic — it builds from the local exports/ directory and fetches
# nothing — so this workflow owns the data fetch: it downloads Fisqua's
# export from the R2 bucket zasqua-export (under neogranadina/) into
# exports/, or, with export_source=b2, the six contract files of the frozen
# Django-era export in Backblaze B2; then `zasqua build` validates them and
# runs the pipeline (precompute, derive-children, enrich, Hugo, Pagefind).
#
# target_bucket is the staging/production switch: it defaults to
# zasqua-staging (-> staging.zasqua.org) and accepts zasqua-site for a direct
# production deploy. There is no separate promote workflow; a staging ->
# production promote is a bucket-to-bucket copy run with upload-to-r2.py
# (--copy-from zasqua-staging zasqua-site).
#
# storage_backend selects which uploader runs (R2 -> B2 transition, 2026-07).
# Default r2 keeps the historical behaviour: the proven, untouched
# upload-to-r2.py signs against Cloudflare R2. Set b2 to run its generalized
# sibling upload-to-b2.py, which signs against Backblaze B2's S3-compatible
# API (only the endpoint, credentials, and signing region differ — see
# upload-to-b2.py's resolve_s3_config). Keeping R2 on its own untouched script
# makes it a byte-for-byte rollback target through the transition; after
# cutover the R2 script retires. The bucket NAME is the same on either store
# (they are mirrored), so target_bucket is unchanged.
#
# Manual trigger only (workflow_dispatch). Runs on ubicloud-standard-8: Hugo's
# working set at ~191K pagesources peaks near 9.4 GB, which OOMs GitHub's free
# 7 GB runner; the 8-core / 32 GB tier gives headroom and parallelism.
#
# Required repository secrets:
#   B2_APPLICATION_KEY_ID, B2_APPLICATION_KEY   (read b2://zasqua-export;
#                                                only when export_source=b2)
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, CLOUDFLARE_ACCOUNT_ID
#   CF_API_TOKEN, CF_ZONE_ID                    (cache purge)
#   B2_S3_ENDPOINT, B2_S3_REGION                (only when storage_backend=b2;
#                                                e.g. https://s3.us-west-004.
#                                                backblazeb2.com and us-west-004)
#   B2_SITE_KEY_ID, B2_SITE_APPLICATION_KEY  (only when storage_backend=b2;
#                                                a B2 app key scoped to write the
#                                                zasqua-site bucket — used as the
#                                                S3 access key / secret)
#
# Inputs:
#   target_bucket   — bucket to deploy to (same name on R2 and B2). Default
#                     zasqua-staging.
#   storage_backend — r2 (default) or b2. Selects the object store; see header.
#   export_source   — r2 (default) or b2. Where the export files are
#                     fetched from: Fisqua's export in the R2 bucket
#                     zasqua-export under neogranadina/
#                     (deploy/fetch-export-r2.py, which joins the per-fonds
#                     description files), or the frozen Django-era export in
#                     the Backblaze B2 bucket. r2 needs the R2_ACCESS_KEY_ID
#                     and R2_SECRET_ACCESS_KEY secrets to have read access to
#                     zasqua-export.
#   dry_run         — run build + diff pass, print would-upload / would-delete,
#                     skip PUT / DELETE / purge.
#   dev_limit       — optional integer cap on records (fast iteration). Unset =
#                     full corpus. A capped build is NOT a valid production
#                     artefact.
#   confirm_deletes — override the 5% delete safety cap on the site upload.
#   authority_exports — also generate the METS, EAC-CPF and Linked Places
#                     records (`zasqua mets`, `zasqua eac`, `zasqua places`,
#                     always the full corpus) into exports-out/, and upload
#                     each set to its prefix (mets/, eac/, places/) of the R2
#                     manifests bucket, zasqua-manifests, whatever
#                     target_bucket says. The upload is additive
#                     (--no-delete): records missing locally are reported as
#                     orphans, never deleted. dry_run applies. Because the
#                     manifests bucket is production, the run fails unless
#                     target_bucket is zasqua-site or dry_run is set (a dry
#                     run against any target rehearses the diff without
#                     writing). A real run also fails while eac_agency_name
#                     in hugo.toml is empty. The three commands exist from
#                     engine 1.5.0, so the input needs the @ucsb-ampl/zasqua
#                     pin at ^1.5.0 or later; under an earlier pin a run with
#                     it on fails at the EAC step, before any upload.
#                     Default false.
#
# Version: v1.3.0

name: Build and deploy to R2 or B2

on:
  workflow_dispatch:
    inputs:
      target_bucket:
        description: "Bucket to deploy to (same name on R2 and B2). Leave as default for staging."
        required: true
        type: string
        default: zasqua-staging
      storage_backend:
        description: "Object store to deploy to. r2 (default) or b2."
        required: false
        type: choice
        options:
          - r2
          - b2
        default: r2
      export_source:
        description: "Where to fetch the export files from. r2 (default: Fisqua's export in zasqua-export/neogranadina/) or b2 (the frozen Django-era export)."
        required: false
        type: choice
        options:
          - r2
          - b2
        default: r2
      dry_run:
        description: "Build + diff pass, print would-upload / would-delete, skip PUT / DELETE / purge."
        required: false
        type: boolean
        default: false
      dev_limit:
        description: "Optional DEV_LIMIT (integer) — cap records for fast iteration. Blank = full corpus."
        required: false
        type: string
      confirm_deletes:
        description: "Override the 5% delete safety cap. Needed for the first cutover deploy over a bucket still holding the old pipeline's output; leave off for routine deploys."
        required: false
        type: boolean
        default: false
      authority_exports:
        description: "Also generate the METS, EAC-CPF and Linked Places records and upload them, additively, to the zasqua-manifests bucket on R2 (whatever target_bucket says). That bucket is production: allowed only with target_bucket=zasqua-site, or with dry_run to rehearse."
        required: false
        type: boolean
        default: false

# Serialise deploys per bucket so concurrent dispatches do not race on the
# R2 LIST / PUT / DELETE pool.
concurrency:
  group: deploy-${{ inputs.storage_backend }}-${{ inputs.target_bucket }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubicloud-standard-8
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deploy dependencies
        # deploy/requirements.txt pins b2[full] (engine fetch) + boto3 (R2
        # upload). Lockfile-only: do not inline-install here.
        run: pip install -r deploy/requirements.txt --quiet

      - name: Install npm dependencies
        # Pulls @ucsb-ampl/zasqua from the registry plus Hugo Extended,
        # Pagefind, and Tailwind (all instance deps). The engine's zasqua CLI
        # lands in node_modules/.bin. The hugo-extended package downloads the
        # Hugo binary from GitHub releases, which can answer 504 for a while,
        # so npm ci is retried. The binary is then kept outside node_modules
        # and every later step points at it: `zasqua build` runs npm ci again,
        # and that second install skips the download instead of depending on
        # GitHub a second time.
        run: |
          for attempt in 1 2 3 4 5; do
            npm ci && break
            if [ "$attempt" = 5 ]; then exit 1; fi
            echo "::warning::npm ci failed (attempt $attempt of 5); retrying in 60 s"
            sleep 60
          done
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          cp node_modules/hugo-extended/bin/hugo "$RUNNER_TEMP/hugo-bin/hugo"
          echo "HUGO_SKIP_DOWNLOAD=1" >> "$GITHUB_ENV"
          echo "HUGO_BIN_PATH=$RUNNER_TEMP/hugo-bin/hugo" >> "$GITHUB_ENV"

      - name: Deploy script unit tests (upload-to-b2 pytest suite)
        # moto[s3] mocks the S3 API in process — no real R2 credentials or
        # network. Cheap fail-fast guard before the expensive build.
        run: |
          pip install -q -r deploy/requirements-dev.txt
          python -m pytest deploy/tests/ -q

      - name: DEV_LIMIT banner
        if: inputs.dev_limit != ''
        run: |
          echo "::warning::DEV_LIMIT=${{ inputs.dev_limit }} — building a subset; NOT a production build."

      - name: Fetch data from B2
        if: inputs.export_source == 'b2'
        # The engine is storage-agnostic: `zasqua build` reads the six contract
        # files from exports/ and never fetches data itself. This instance
        # stores its exports in Backblaze B2, so it downloads them here, into
        # exports/, before the build. The b2 CLI is installed via
        # deploy/requirements.txt above; the bucket name lives here, in the
        # instance, not in the engine.
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          b2 account authorize "$B2_APPLICATION_KEY_ID" "$B2_APPLICATION_KEY"
          mkdir -p exports
          for f in descriptions repositories entities places entity_links place_links; do
            b2 file download "b2://zasqua-export/$f.json" "exports/$f.json"
          done
          ls -lh exports/descriptions.json exports/repositories.json

      - name: Fetch data from R2 (Fisqua export)
        # Reads neogranadina/ in the zasqua-export bucket and writes the six
        # contract files into exports/, joining the per-fonds description
        # files into descriptions.json. The step fails if a listed file is
        # missing or a description id repeats across fonds.
        if: inputs.export_source != 'b2'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          python3 deploy/fetch-export-r2.py --output-dir exports
          ls -lh exports/descriptions.json exports/repositories.json

      - name: Build the redirect table
        # Entities, places and descriptions that have been recoded keep their
        # old addresses: the exports list each retired code on the record
        # (`former_codes`, `former_reference_codes`), and the serving Worker
        # answers an old `/<code>/` with a 301 to the new one from a KV
        # namespace bound as REDIRECTS. The table is built here, before the
        # site build, so that a malformed export stops the run early; it is
        # uploaded only after the site upload has succeeded (below), so a
        # failed run never points an old address at a page that is not in
        # the bucket.
        run: |
          set -o pipefail
          python3 deploy/build-redirects.py exports redirects.json | tee redirects.log

      - name: Build site (zasqua build)
        # Validates the fetched inputs, then runs precompute-links,
        # derive-children, enrich, Hugo, and Pagefind against the exports/
        # downloaded above.
        env:
          DEV_LIMIT: ${{ inputs.dev_limit }}
        run: |
          npx zasqua build
          echo "Pages: $(find public -name 'index.html' | wc -l)"
          echo "Site size: $(du -sh public | cut -f1)"

      # Authority exports. The three generators read the same exports/ as the
      # build and write outside public/, so the records never ship in the
      # site upload: they go to the manifests bucket, which is the host
      # mets_base_url, eac_base_url and places_base_url in hugo.toml point at.
      # The generators ignore DEV_LIMIT and always emit the full corpus.
      - name: Authority exports only against production
        # zasqua-manifests serves the live site, so writing to it alongside a
        # staging deploy would publish records ahead of the pages that link to
        # them. A dry run lists and diffs without writing, so it may run
        # against any target, and with no agency name. A real run needs one:
        # the engine takes it from the legal_name in exports/publisher.json,
        # else from eac_agency_name in hugo.toml, and without either every
        # EAC-CPF record would fall back to the site title as its
        # maintenance agency.
        # The upload steps below take R2 credentials from the repository
        # secrets. A dry run without them still passes, because the uploader
        # lists the bucket only when it has credentials, and then reports
        # every file as new and nothing as an orphan: a rehearsal that proves
        # nothing. So the secrets are required here, dry run or not.
        if: inputs.authority_exports
        env:
          TARGET_BUCKET: ${{ inputs.target_bucket }}
          DRY_RUN: ${{ inputs.dry_run }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY are not set; without them the manifests upload cannot list zasqua-manifests, so even a dry run would report nothing real"
            exit 1
          fi
          if [ "$TARGET_BUCKET" != "zasqua-site" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::authority_exports writes to zasqua-manifests, a production bucket; run it only with target_bucket=zasqua-site, or with dry_run=true to rehearse"
            exit 1
          fi
          if [ "$DRY_RUN" != "true" ]; then
            AGENCY=$(python3 deploy/agency-name.py exports hugo.toml)
            if [ -z "$AGENCY" ]; then
              echo "::error::no agency name: exports/publisher.json has no legal_name and eac_agency_name is empty in hugo.toml; set one before publishing EAC-CPF records"
              exit 1
            fi
          fi

      - name: Generate METS (zasqua mets)
        if: inputs.authority_exports
        env:
          METS_DIR: exports-out/mets
        run: |
          npx zasqua mets
          echo "METS files: $(find exports-out/mets -type f | wc -l)"

      - name: Generate EAC-CPF (zasqua eac)
        if: inputs.authority_exports
        env:
          EAC_DIR: exports-out/eac
        run: |
          npx zasqua eac
          echo "EAC-CPF files: $(find exports-out/eac -type f | wc -l)"

      - name: Generate Linked Places (zasqua places)
        if: inputs.authority_exports
        env:
          PLACES_DIR: exports-out/places
        run: |
          npx zasqua places
          echo "Linked Places files: $(find exports-out/places -type f | wc -l)"

      # The manifests bucket stays on R2 whatever storage_backend says, and
      # upload-to-r2.py writes to it only in additive mode (--prefix with
      # --no-delete): each upload lists and diffs only its own prefix, so it
      # never sees the sibling prefixes, and it reports orphans rather than
      # deleting them. The uploads run before the site upload, so the site
      # never links to records that are not yet published.
      - name: Upload METS to zasqua-manifests/mets/
        if: inputs.authority_exports
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          DRY_RUN_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_RUN_FLAG="--dry-run"
          python3 deploy/upload-to-r2.py exports-out/mets zasqua-manifests \
            --prefix mets/ --no-delete --diff \
            $DRY_RUN_FLAG | tee upload-mets.log

      - name: Upload EAC-CPF to zasqua-manifests/eac/
        if: inputs.authority_exports
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          DRY_RUN_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_RUN_FLAG="--dry-run"
          python3 deploy/upload-to-r2.py exports-out/eac zasqua-manifests \
            --prefix eac/ --no-delete --diff \
            $DRY_RUN_FLAG | tee upload-eac.log

      - name: Upload Linked Places to zasqua-manifests/places/
        if: inputs.authority_exports
        env:
          PYTHONUNBUFFERED: "1"
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          DRY_RUN_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_RUN_FLAG="--dry-run"
          python3 deploy/upload-to-r2.py exports-out/places zasqua-manifests \
            --prefix places/ --no-delete --diff \
            $DRY_RUN_FLAG | tee upload-places.log

      - name: Shard sitemap.xml (keep shards under 50K URLs)
        # Hugo emits a single ~191K-URL sitemap.xml; Google caps a sitemap at
        # 50K URLs. shard-sitemap.py splits it into 45K-URL shards and rewrites
        # sitemap.xml as a sitemap index. Idempotent; skips when under 45K.
        run: python3 deploy/shard-sitemap.py

      - name: Deploy site (${{ inputs.target_bucket }} on ${{ inputs.storage_backend }})
        id: upload
        env:
          PYTHONUNBUFFERED: "1"
          STORAGE_BACKEND: ${{ inputs.storage_backend }}
          # R2 (default backend) credentials.
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          # B2 credentials — consumed only when storage_backend=b2. Absent
          # secrets resolve to empty strings, which the upload script rejects
          # with a clear "must be set" error, so a b2 run without them fails
          # loudly rather than writing nowhere.
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_S3_REGION: ${{ secrets.B2_S3_REGION }}
          B2_S3_ACCESS_KEY_ID: ${{ secrets.B2_SITE_KEY_ID }}
          B2_S3_SECRET_ACCESS_KEY: ${{ secrets.B2_SITE_APPLICATION_KEY }}
        run: |
          set -o pipefail
          # Select the uploader by backend. This is deliberately a choice of
          # SCRIPT, not just of credentials: the r2 path runs the untouched,
          # proven upload-to-r2.py with the R2_* environment (the byte-for-byte
          # rollback target during the transition), while the b2 path runs its
          # generalized sibling upload-to-b2.py with the generic S3_* variables
          # exported from the B2 secrets. After cutover the R2 script retires.
          if [ "$STORAGE_BACKEND" = "b2" ]; then
            echo "::notice::storage_backend=b2 — deploying via upload-to-b2.py (Backblaze B2)."
            export S3_ENDPOINT="$B2_S3_ENDPOINT"
            export S3_REGION="$B2_S3_REGION"
            export S3_ACCESS_KEY_ID="$B2_S3_ACCESS_KEY_ID"
            export S3_SECRET_ACCESS_KEY="$B2_S3_SECRET_ACCESS_KEY"
            UPLOAD_SCRIPT=deploy/upload-to-b2.py
          else
            UPLOAD_SCRIPT=deploy/upload-to-r2.py
          fi
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "::notice::dry_run=true — diff pass runs but no PUT / DELETE will be issued."
          fi
          CONFIRM_FLAG=""
          [ "${{ inputs.confirm_deletes }}" = "true" ] && CONFIRM_FLAG="--confirm-deletes"
          python3 "$UPLOAD_SCRIPT" public "${{ inputs.target_bucket }}" \
            --concurrency 100 \
            --diff \
            $CONFIRM_FLAG \
            $DRY_RUN_FLAG | tee upload.log

          # Parse the summary line for the skip-purge guard. Shape:
          #   r2-upload uploaded=<N> skipped=<N> deleted=<N> failed=<N> ...
          # Dry-run emits `r2-upload mode=dry-run would_upload=<N> ...`.
          SUMMARY=$(grep '^r2-upload ' upload.log | tail -1 || true)
          if echo "$SUMMARY" | grep -q 'mode=dry-run'; then
            UPLOADED=0; DELETED=0
          else
            UPLOADED=$(echo "$SUMMARY" | grep -oE 'uploaded=[0-9]+' | head -1 | cut -d= -f2)
            DELETED=$(echo "$SUMMARY" | grep -oE 'deleted=[0-9]+' | head -1 | cut -d= -f2)
          fi
          if [ "${UPLOADED:-0}" -gt 0 ] || [ "${DELETED:-0}" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "summary_line=$SUMMARY" >> "$GITHUB_OUTPUT"

      - name: Upload the redirect table
        # Runs only after the site upload has succeeded. On an export without
        # former codes the table is empty and the upload is skipped. The token
        # needs the Workers KV Storage edit permission. The namespace ids
        # match deploy/worker/wrangler.toml.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          BUILT=$(grep -oE 'built=[0-9]+' redirects.log | head -1 | cut -d= -f2)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::dry_run=true — redirect table built, not uploaded."
          elif [ "${BUILT:-0}" -eq 0 ]; then
            echo "::notice::No former codes in the exports — nothing to upload."
          else
            case "${{ inputs.target_bucket }}" in
              zasqua-staging) NAMESPACE_ID=1900a3f647a648bfb6705006e0d0cc7b ;;
              zasqua-site)    NAMESPACE_ID=8b38f16d45fe443084937e12b65f81df ;;
              *)              NAMESPACE_ID="" ;;
            esac
            if [ -z "$NAMESPACE_ID" ]; then
              echo "::notice::No redirect namespace for bucket ${{ inputs.target_bucket }} — table not uploaded."
            else
              npx --yes wrangler kv bulk put redirects.json --namespace-id "$NAMESPACE_ID" --remote
            fi
          fi

      - name: Purge Cloudflare cache
        # Skip when nothing changed or on dry runs.
        if: steps.upload.outputs.changed == 'true' && inputs.dry_run != true
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          response=$(curl -s -w "\n__HTTP_STATUS__%{http_code}" -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything": true}')
          http_code="${response##*__HTTP_STATUS__}"
          body="${response%__HTTP_STATUS__*}"
          echo "Cloudflare purge HTTP ${http_code}"
          echo "${body}"
          if [ "${http_code}" -ne 200 ]; then
            echo "::error::Cloudflare cache purge returned HTTP ${http_code}"
            exit 1
          fi
          echo "Cache purged"

      - name: Write GHA summary
        if: always()
        run: |
          {
            echo "## Deploy — summary"
            echo ""
            echo "**Target bucket:** \`${{ inputs.target_bucket }}\`"
            echo "**Dry run:** \`${{ inputs.dry_run }}\`"
            echo "**DEV_LIMIT:** \`${{ inputs.dev_limit || 'unset' }}\`"
            echo "**Authority exports:** \`${{ inputs.authority_exports }}\`"
            echo ""
            echo "### r2-upload summary"
            echo '```'
            grep '^r2-upload ' upload.log 2>/dev/null | tail -1 || echo "(no r2-upload summary line — upload did not run or failed before emission)"
            echo '```'
            echo ""
            echo "### Redirect table"
            echo '```'
            grep '^redirects ' redirects.log 2>/dev/null | tail -1 || echo "(no redirects summary line — the step did not run or failed before emission)"
            echo '```'
            echo ""
            echo "### Cache purge"
            if [ "${{ steps.upload.outputs.changed }}" = "true" ] && [ "${{ inputs.dry_run }}" != "true" ]; then
              echo "Purged (uploaded or deleted > 0)."
            elif [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Skipped (dry_run=true)."
            else
              echo "Skipped (no changes detected)."
            fi
            if [ "${{ inputs.authority_exports }}" = "true" ]; then
              echo ""
              echo "### Authority exports (zasqua-manifests)"
              echo ""
              echo "| Prefix | Files generated |"
              echo "|---|---|"
              for d in mets eac places; do
                if [ -d "exports-out/$d" ]; then
                  echo "| \`$d/\` | $(find "exports-out/$d" -type f | wc -l | tr -d ' ') |"
                else
                  echo "| \`$d/\` | (not generated) |"
                fi
              done
              echo ""
              echo '```'
              for d in mets eac places; do
                echo "$d: $(grep '^r2-upload ' "upload-$d.log" 2>/dev/null | tail -1 || true)"
              done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

